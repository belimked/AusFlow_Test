name: Set mailbox credential

# Points each environment at its ops mailbox by writing the Pages secret MAIL_ADDRESS_JWT: production
# (project wasteid-prototype) gets MAIL_JWT_PRODUCTION, UAT (project wasteid-uat) gets MAIL_JWT_UAT.
# Runs when this file changes and by hand after changing either repo secret (it is idempotent); then redeploy
# (Deploy / Deploy UAT) so the new value is live.
on:
  push:
    paths: [.github/workflows/mail-secret.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  set:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CF: https://api.cloudflare.com/client/v4/accounts/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/pages/projects
    steps:
      - name: Production → wasteid-prototype
        env:
          JWT: ${{ secrets.MAIL_JWT_PRODUCTION }}
        run: |
          [ -n "$JWT" ] || { echo "::error::MAIL_JWT_PRODUCTION is not set"; exit 1; }
          jq -n --arg v "$JWT" '{deployment_configs:{production:{env_vars:{MAIL_ADDRESS_JWT:{type:"secret_text",value:$v}}}}}' \
            | curl -sf -X PATCH -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" -H 'Content-Type: application/json' \
              "$CF/wasteid-prototype" -d @- | jq '{success, vars: (.result.deployment_configs.production.env_vars | keys)}'
      - name: UAT → wasteid-uat
        env:
          JWT: ${{ secrets.MAIL_JWT_UAT }}
        run: |
          [ -n "$JWT" ] || { echo "::error::MAIL_JWT_UAT is not set"; exit 1; }
          jq -n --arg v "$JWT" '{deployment_configs:{production:{env_vars:{MAIL_ADDRESS_JWT:{type:"secret_text",value:$v}}}}}' \
            | curl -sf -X PATCH -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" -H 'Content-Type: application/json' \
              "$CF/wasteid-uat" -d @- | jq '{success, vars: (.result.deployment_configs.production.env_vars | keys)}'
